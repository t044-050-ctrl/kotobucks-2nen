    body {

    /* 画面切り替えフェードアニメーション */
    .fade-view {

    @keyframes fadeIn {
      from {

        transform: translateY(6px);

      to {

      }
    }

    /* 正誤フィードバックの拡大ポップアニメーション */
    @keyframes markPop {
      0% {

      55% {

      100% {

  <script>
    /* =========================================================================
       1. 効果音エンジン (Tone.js)
       ========================================================================= */
    let isMuted = false;
    let synth = null;

    function initAudio() {
      if (!synth && typeof Tone !== 'undefined') {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.3 }
          }).toDestination();
        } catch (e) {
          console.warn('Audio initialization skipped:', e);
        }
      }
    }

    async function playSound(type) {
      if (isMuted) return;
      try {
        if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
          await Tone.start();
        }
        initAudio();
        if (!synth) return;

        const now = Tone.now();
        if (type === 'tap') {
          synth.triggerAttackRelease('G5', '32n', now);
        } else if (type === 'correct') {
          synth.triggerAttackRelease('E5', '16n', now);
          synth.triggerAttackRelease('G5', '16n', now + 0.09);
          synth.triggerAttackRelease('C6', '8n', now + 0.18);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease('F3', '16n', now);
          synth.triggerAttackRelease('E3', '8n', now + 0.12);
        } else if (type === 'clear') {
          synth.triggerAttackRelease('C5', '16n', now);
          synth.triggerAttackRelease('E5', '16n', now + 0.1);
          synth.triggerAttackRelease('G5', '16n', now + 0.2);
          synth.triggerAttackRelease('C6', '4n', now + 0.3);
        }
      } catch (e) {
        // 音声再生エラーは静かに無視
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const icon = document.getElementById('mute-icon');
      const label = document.getElementById('mute-label');
      if (isMuted) {
        icon.textContent = '🔇';
        label.textContent = 'おと OFF';
      } else {
        icon.textContent = '🔊';
        label.textContent = 'おと ON';
        playSound('tap');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast-box');
      toast.textContent = message;
      toast.classList.remove('hidden', 'opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.classList.add('hidden'), 300);
      }, 2800);
    }

              { q: '「おなじ いみの ことば」を くりかえし つかう かわりに にた いみの ことばを つかう と、ぶんは どう なる？', c: ['ひょうげんが ゆたかに なり、読みやすい ぶんに なる', 'いみが わからなく なる', 'ぶんが 消える'], a: 'ひょうげんが ゆたかに なり、読みやすい ぶんに なる', exp: 'にた いみの ことばを つかいわけると さくぶんが とても 上手に なります。' },
              { q: '「はしる」と「かける」の ように、にた いみの ことばでも ちょっとだけ ちがう ところは なに？', c: ['つかう ばめんや いきおい・かんじかたの ちがい', 'もじの いろ', 'よみかたが ぜんぶ おなじ'], a: 'つかう ばめんや いきおい・かんじかたの ちがい', exp: 'ばめんに あわせて ぴったりの ことばを えらべるように なりましょう！' }
            ]
          }
        ]
      }
    };

    /* =========================================================================
       3. アプリ状態管理・ユーティリティ関数
       ========================================================================= */
    const state = {
      selectedGrade: 2,
      selectedUnitId: '2-u1',
      screen: 'home', // 'home' | 'minna' | 'minna-done' | 'hitori-menu' | 'quiz' | 'stage-result' | 'certificate'
      minnaQueue: [],
      minnaIndex: 0,
      minnaScore: 0,
      minnaAnswered: false,
      minnaLastCorrect: false,
      minnaSelectedChoice: null,
      currentStage: 1,
      quizQueue: [],
      quizIndex: 0,
      missedList: [],
      answeringLocked: false,
      feedbackData: null,
      isRetryRun: false,
      stage1Passed: false,
      stage2Passed: false,
      studentName: ''
    };

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getSelectedUnitData() {
      const gradeObj = CURRICULUM[state.selectedGrade];
      const mixId = `mix-${state.selectedGrade}`;
      if (state.selectedUnitId === mixId) {
        const allMinna = [];
        const allS1 = [];
        const allS2 = [];
        gradeObj.units.forEach(u => {
          u.minnaQuiz.forEach(q => allMinna.push({ ...q, unitTitle: u.title }));
          u.stage1.forEach(q => allS1.push({ ...q, unitTitle: u.title }));
          u.stage2.forEach(q => allS2.push({ ...q, unitTitle: u.title }));
        });
        return {
          id: mixId,
          pages: gradeObj.shortLabel,
          title: `${gradeObj.shortLabel} まとめ そうごうテスト`,
          minnaQuiz: shuffleArray(allMinna).slice(0, 10),
          stage1: shuffleArray(allS1).slice(0, 10),
          stage2: shuffleArray(allS2).slice(0, 10)
        };
      }
      return gradeObj.units.find(u => u.id === state.selectedUnitId) || gradeObj.units[0];
    }

    /* 穴埋め用の「＿」のまとまりごとにアンダーラインへ変換（2文字連続時は「＿ ＿」の2本に分けて表示） */
    function formatQuestionText(text) {
      return escapeHtml(text).replace(/＿+/g, () => {
        return '<span class="inline-block border-b-4 border-current min-w-[1.6em] mx-1 align-baseline leading-none">&nbsp;</span>';
      });
    }

    /* 「かたかなで書く（かく）ことば」を選ぶ問題（選択肢はすべて平仮名）か判定 */
    function isKatakanaWriteQuestion(qObj) {
      return !qObj.c.includes(qObj.a) && /かたかなで\s*(かく|書く)/.test(qObj.q);
    }

    /* 平仮名選択肢（のばす音含む）を片仮名正答と比較するために正規化 */
    function normalizeKanaForCompare(str) {
      return toKatakana(str)
        .replace(/([アカサタナハマヤラワガザダバパァャ])ア/g, '$1ー')
        .replace(/([イキシチニヒミリギジヂビピィ])イ/g, '$1ー')
        .replace(/([ウクスツヌフムユルグズヅブプゥュ])ウ/g, '$1ー')
        .replace(/([エケセテネヘメレゲゼデベペェ])エ/g, '$1ー')
        .replace(/([オコソトノホモヨロゴゾドボポォョ])[オウ]/g, '$1ー');
    }

    /* 選択肢の正誤判定（「かたかなで書くことば」問題のみ平仮名選択肢→片仮名正答に対応） */
    function isChoiceCorrect(choice, qObj) {
      if (choice === qObj.a) return true;
      if (isKatakanaWriteQuestion(qObj) && normalizeKanaForCompare(choice) === qObj.a) {
        return true;
      }
      return false;
    }

    function goHome() {
      playSound('tap');
      state.screen = 'home';
      render();
    }

    function render() {
      const root = document.getElementById('screen-root');
      const btnHome = document.getElementById('btn-home');
      const headerStatus = document.getElementById('header-status');
      const unit = getSelectedUnitData();
      const gradeObj = CURRICULUM[state.selectedGrade];

      if (state.screen === 'home') {
        btnHome.classList.add('hidden');
        btnHome.classList.remove('flex');
        headerStatus.innerHTML = `
          <span class="inline-block px-3 py-0.5 rounded-full bg-amber-300 text-amber-950 font-bold text-xs sm:text-sm">
            ２年生 国語 ことばの学習
          </span>
        `;
      } else {
        btnHome.classList.remove('hidden');
        btnHome.classList.add('flex');
        headerStatus.innerHTML = `
          <span class="inline-block px-3 py-0.5 rounded-full bg-white border border-rose-300 text-rose-950 font-bold text-xs sm:text-sm">
            ${gradeObj.shortLabel}｜${unit.title}
          </span>
        `;
      }

      if (state.screen === 'home') {
        renderHome(root);
      } else if (state.screen === 'minna') {
        renderMinna(root);
      } else if (state.screen === 'minna-done') {
        renderMinnaDone(root);
      } else if (state.screen === 'hitori-menu') {
        renderHitoriMenu(root);
      } else if (state.screen === 'quiz') {
        renderQuiz(root);
      } else if (state.screen === 'stage-result') {
        renderStageResult(root);
      } else if (state.screen === 'certificate') {
        renderCertificate(root);
      }
    }

    /* -------------------------------------------------------------------------
       画面B: 「みんなでべんきょう」モード（3択クイズ＋手動「次へ」ボタン進行）
       ------------------------------------------------------------------------- */
    function startMinna() {
      const unit = getSelectedUnitData();
      if (!unit || !unit.minnaQuiz) return;
      playSound('tap');
      state.screen = 'minna';
      state.minnaIndex = 0;
      state.minnaScore = 0;
      state.minnaAnswered = false;
      state.minnaLastCorrect = false;
      state.minnaSelectedChoice = null;
      // 選択肢順序をシャッフルして問題ごとに固定（回答後も位置を変えない）
      state.minnaQueue = unit.minnaQuiz.map(q => ({
        ...q,
        _shuffledChoices: shuffleArray(q.c)
      }));
      render();
    }

    function submitMinnaAnswer(selectedChoice) {
      if (state.minnaAnswered) return;
      const currentQ = state.minnaQueue[state.minnaIndex];
      const isCorrect = isChoiceCorrect(selectedChoice, currentQ);

      state.minnaAnswered = true;
      state.minnaLastCorrect = isCorrect;
      state.minnaSelectedChoice = selectedChoice;

      if (isCorrect) {
        state.minnaScore++;
        playSound('correct');
      } else {
        playSound('wrong');
      }
      render();
    }

    function nextMinnaQuestion() {
      playSound('tap');
      if (state.minnaIndex + 1 < state.minnaQueue.length) {
        state.minnaIndex++;
        state.minnaAnswered = false;
        state.minnaLastCorrect = false;
        state.minnaSelectedChoice = null;
        render();
      } else {
        playSound('clear');
        state.screen = 'minna-done';
        render();
      }
    }

      const currentQ = state.minnaQueue[state.minnaIndex];
      const total = state.minnaQueue.length;
      const choices = currentQ._shuffledChoices || currentQ.c;

      root.innerHTML = `

                state.minnaLastCorrect
                  ? 'bg-amber-400 text-amber-950 border-2 border-amber-600'
                  : 'bg-rose-500 text-white border-2 border-rose-700'

                <span class="text-2xl leading-none">${state.minnaLastCorrect ? '○' : '×'}</span>

                  <span>${displayLabel}</span>

                <span class="font-extrabold text-rose-700 mr-1">💡 ポイント：</span>
                <span>${currentQ.exp}</span>
              </div>
              <button type="button" onclick="nextMinnaQuestion()"
                class="w-full sm:w-auto shrink-0 py-3.5 px-7 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-base sm:text-lg shadow-lg border-b-4 border-emerald-700 transition transform hover:scale-105 active:scale-95">
                ${isLast ? 'けっかを みる ▶' : 'つぎへ ▶'}
              </button>
            ` : `
              <p class="w-full text-center text-xs sm:text-sm font-bold text-rose-900">
                みんなで かんがえて、ただしい ものを えらぼう！（えらぶと かいせつと「つぎへ」ボタンが 出ます）
              </p>
            `}
          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       画面C: 「みんなでべんきょう」完了画面
       ------------------------------------------------------------------------- */

    /* -------------------------------------------------------------------------
       画面D: 「ひとりでちょうせん」ステージ選択画面

    function openHitoriMenu() {
      playSound('tap');
      state.screen = 'hitori-menu';
      state.stage1Passed = false;
      state.stage2Passed = false;
      render();
    }

    function startQuizStage(stageNum, retryQuestions = null) {
      playSound('tap');
      const unit = getSelectedUnitData();
      state.currentStage = stageNum;
      state.screen = 'quiz';
      state.quizIndex = 0;
      state.missedList = [];
      state.answeringLocked = false;
      state.feedbackData = null;

      const rawList = (retryQuestions && retryQuestions.length > 0)
        ? retryQuestions
        : (stageNum === 1 ? unit.stage1 : unit.stage2);

      state.isRetryRun = !!(retryQuestions && retryQuestions.length > 0);
      state.quizQueue = shuffleArray(rawList).map(q => ({
        ...q,
        _shuffledChoices: shuffleArray(q.c)
      }));
      render();
    }

    function renderHitoriMenu(root) {
      const unit = getSelectedUnitData();
      root.innerHTML = `
        <div class="fade-view flex flex-col items-center justify-center text-center my-auto gap-5">
          <div>
            <span class="inline-block px-3 py-1 rounded-full bg-amber-300 text-amber-950 font-extrabold text-xs sm:text-sm mb-2">

            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">${unit.title}</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-xl">
            <button type="button" onclick="startQuizStage(1)"

              <span class="text-xs bg-white/70 px-3 py-0.5 rounded-full">きほんへん（${unit.stage1.length}もん）</span>

              <span class="text-xs font-bold">${state.stage1Passed ? '✅ クリアずみ！' : 'まずは ここから スタート！'}</span>

              ${currentQ.unitTitle ? `<span class="text-xs font-bold text-rose-800">[${currentQ.unitTitle}]</span>` : ''}

            <div class="flex items-center gap-2">
              <span class="px-3.5 py-1 rounded-full bg-amber-100 border-2 border-amber-400 text-amber-950 font-extrabold text-sm">

              ${formatQuestionText(currentQ.q)}

            <!-- 正誤オーバーレイ（大きな ○ / × ） -->
            ${state.feedbackData ? `
              <div class="absolute inset-0 flex items-center justify-center bg-white/85 rounded-2xl pointer-events-none">
                <div class="animate-mark-pop text-8xl sm:text-9xl font-extrabold ${
                  state.feedbackData.isCorrect ? 'text-amber-500' : 'text-rose-500'
                }">
                  ${state.feedbackData.isCorrect ? '○' : '×'}
                </div>
              </div>
            ` : ''}
          </div>

          <!-- 解説メッセージ（回答後に表示） -->
          <div class="min-h-[54px] flex items-center justify-center">
            ${state.feedbackData ? `
              <div class="w-full p-3 rounded-2xl border-2 font-bold text-xs sm:text-sm text-center fade-view ${
                state.feedbackData.isCorrect
                  ? 'bg-amber-100 border-amber-500 text-amber-950'
                  : 'bg-rose-100 border-rose-400 text-rose-950'
              }">
                <span class="font-extrabold mr-1">${state.feedbackData.isCorrect ? 'せいかい！' : `ざんねん！せいかいは「${currentQ.a}」`}</span>
                <span>${state.feedbackData.exp}</span>
              </div>
            ` : `
              <p class="text-xs sm:text-sm font-bold text-rose-900">したから ただしい ものを １つ えらぼう！</p>
            `}
          </div>

          <!-- 選択肢ボタン（位置を固定したまま色だけ変更） -->
          <div class="grid grid-cols-1 gap-3">
            ${choices.map(choice => {
              let btnStyle = 'choice-btn-idle bg-white border-rose-200 text-slate-800';
              let displayLabel = choice;
              if (state.feedbackData) {
                if (isChoiceCorrect(choice, currentQ)) {
                  btnStyle = 'bg-amber-400 border-amber-600 text-amber-950';
                  displayLabel = isKatakanaWriteQuestion(currentQ) ? currentQ.a : choice;
                } else {
                  btnStyle = 'bg-slate-100 border-slate-200 text-slate-400';
                }
              }
              return `
                <button type="button" onclick="submitAnswer('${choice.replace(/'/g, "\\'")}')"
                  ${state.answeringLocked ? 'disabled' : ''}
                  class="w-full py-3.5 sm:py-4 px-5 rounded-2xl border-4 font-extrabold text-base sm:text-xl shadow-md transition transform active:scale-95 ${btnStyle}">
                  ${displayLabel}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function submitAnswer(selectedChoice) {
      if (state.answeringLocked) return;
      state.answeringLocked = true;

      const currentQ = state.quizQueue[state.quizIndex];
      const isCorrect = isChoiceCorrect(selectedChoice, currentQ);

      if (isCorrect) {
        playSound('correct');
      } else {
        playSound('wrong');
        state.missedList.push(currentQ);
      }

      state.feedbackData = {
        isCorrect,
        exp: currentQ.exp
      };
      render();

      setTimeout(() => {
        state.feedbackData = null;
        state.answeringLocked = false;
        if (state.quizIndex + 1 < state.quizQueue.length) {
          state.quizIndex++;
          render();
        } else {
          finishStage();
        }
      }, isCorrect ? 1300 : 2100);
    }

    function finishStage() {
      if (state.missedList.length === 0) {
        if (state.currentStage === 1) state.stage1Passed = true;
        if (state.currentStage === 2) state.stage2Passed = true;
        playSound('clear');

        if (state.stage1Passed && state.stage2Passed) {
          state.screen = 'certificate';
          render();
          return;
        }
      }
      state.screen = 'stage-result';
      render();
    }

    /* -------------------------------------------------------------------------
       画面G: ごうかくしょう（合格証書・リアルタイム日時・スマホ風文字パネル入力）
       ------------------------------------------------------------------------- */
    function getFormattedNow() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}年${m}月${d}日 ${hh}:${mm}`;
    }

    const kbState = {
      committed: '',
      composing: '',
      lastKeyId: null,
      toggleIndex: 0,
      canToggleLast: false
    };

    function openNameKeyboard() {
      playSound('tap');
      kbState.committed = state.studentName || '';
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.toggleIndex = 0;
      kbState.canToggleLast = false;

      const modal = document.getElementById('kana-keyboard-modal');
      modal.classList.remove('hidden');
      renderKeyboardModal();
    }

    function closeNameKeyboard(applyText) {
      playSound('tap');
      if (applyText) {
        state.studentName = kbState.committed + kbState.composing;
      }
      const modal = document.getElementById('kana-keyboard-modal');
      modal.classList.add('hidden');
      render();
    }

    function toKatakana(str) {
      return str.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
    }

    function getConversionCandidates(composing) {
      if (!composing) return [];
      const results = [];
      const seen = new Set();

      const addCandidate = (word, consumeLen) => {
        const key = `${word}::${consumeLen}`;
        if (!seen.has(key)) {
          seen.add(key);
          results.push({ word, consumeLen });
        }
      };

      for (let len = composing.length; len >= 1; len--) {
        const prefix = composing.slice(0, len);
        if (KANJI_DICT[prefix]) {
          KANJI_DICT[prefix].forEach(w => addCandidate(w, len));
        }
      }

      addCandidate(composing, composing.length);
      const kata = toKatakana(composing);
      if (kata !== composing) {
        addCandidate(kata, composing.length);
      }

      return results;
    }

    function applyConversionCandidate(word, consumeLen) {
      playSound('tap');
      kbState.committed += word;
      kbState.composing = kbState.composing.slice(consumeLen);
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function inputKanaChar(keyObj, mode, flickDir = 'center') {
      if (keyObj.isModifier) {
        if (kbState.composing.length > 0) {
          const lastChar = kbState.composing.slice(-1);
          if (CHAR_CYCLE_MAP[lastChar]) {
            kbState.composing = kbState.composing.slice(0, -1) + CHAR_CYCLE_MAP[lastChar];
          }
        } else if (kbState.committed.length > 0) {
          const lastChar = kbState.committed.slice(-1);
          if (CHAR_CYCLE_MAP[lastChar]) {
            kbState.committed = kbState.committed.slice(0, -1) + CHAR_CYCLE_MAP[lastChar];
          }
        }
        kbState.lastKeyId = null;
        kbState.canToggleLast = false;
        updateKeyboardDisplay();
        return;
      }

      if (mode === 'flick') {
        const ch = keyObj.flick[flickDir] || keyObj.flick.center;
        if (ch === '　') {
          kbState.committed += kbState.composing + '　';
          kbState.composing = '';
        } else {
          kbState.composing += ch;
        }
        kbState.lastKeyId = null;
        kbState.canToggleLast = false;
      } else {
        if (kbState.canToggleLast && kbState.lastKeyId === keyObj.id && kbState.composing.length > 0) {
          kbState.toggleIndex = (kbState.toggleIndex + 1) % keyObj.toggle.length;
          const nextChar = keyObj.toggle[kbState.toggleIndex];
          kbState.composing = kbState.composing.slice(0, -1) + nextChar;
        } else {
          kbState.toggleIndex = 0;
          const firstChar = keyObj.toggle[0];
          if (firstChar === '　') {
            kbState.committed += kbState.composing + '　';
            kbState.composing = '';
            kbState.lastKeyId = null;
            kbState.canToggleLast = false;
          } else {
            kbState.composing += firstChar;
            kbState.lastKeyId = keyObj.id;
            kbState.canToggleLast = true;
          }
        }
      }

      updateKeyboardDisplay();
    }

    function advanceKanaCursor() {
      playSound('tap');
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function backspaceKana() {
      playSound('tap');
      if (kbState.composing.length > 0) {
        kbState.composing = kbState.composing.slice(0, -1);
      } else if (kbState.committed.length > 0) {
        kbState.committed = kbState.committed.slice(0, -1);
      }
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function clearKanaAll() {
      playSound('tap');
      kbState.committed = '';
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function commitComposingText() {
      playSound('tap');
      kbState.committed += kbState.composing;
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    /* 入力テキストと漢字変換候補バーだけを部分更新（パネル全体の再描画・点滅を防止） */
    function updateKeyboardDisplay() {
      const textEl = document.getElementById('kb-text-display');
      const candEl = document.getElementById('kb-candidates-bar');
      if (!textEl || !candEl) return;

      textEl.innerHTML = `
        <span>${escapeHtml(kbState.committed)}</span><span class="underline decoration-rose-500 decoration-4 bg-amber-100 text-rose-900 px-0.5 rounded">${escapeHtml(kbState.composing)}</span><span class="inline-block w-0.5 h-6 bg-amber-600 animate-pulse align-middle ml-0.5"></span>
        ${(!kbState.committed && !kbState.composing) ? '<span class="text-slate-400 text-base font-bold">したの パネルで 入力してね</span>' : ''}
      `;

      const candidates = getConversionCandidates(kbState.composing);
      candEl.innerHTML = candidates.length > 0
        ? candidates.map(c => `
            <button type="button" onclick="applyConversionCandidate('${c.word.replace(/'/g, "\\'")}', ${c.consumeLen})"
              class="shrink-0 px-3.5 py-1.5 rounded-xl bg-white hover:bg-amber-100 border-2 border-amber-400 text-slate-900 font-extrabold text-base sm:text-lg shadow-sm active:scale-95 transition">
              ${escapeHtml(c.word)}
            </button>
          `).join('')
        : `<span class="text-xs font-bold text-amber-800/80 px-2">ひらがなを 入れると ここに 漢字の こうほが 出ます（タップ＝トグル／スライド＝フリック）</span>`;
    }

    function renderKeyboardModal() {
      const modal = document.getElementById('kana-keyboard-modal');

      const keysHtml = KANA_KEYS.map(k => {
        const subHint = k.flick
          ? `<span class="text-[10px] font-bold text-rose-800/80 leading-none mt-0.5">${k.flick.left}・${k.flick.up}・${k.flick.right}・${k.flick.down}</span>`
          : `<span class="text-[10px] font-bold text-rose-800/80 leading-none mt-0.5">へんかん</span>`;

        return `
          <button type="button" data-key-id="${k.id}"
            class="kana-pad-key relative py-2.5 sm:py-3 px-2 rounded-2xl border-2 border-rose-300 bg-white hover:bg-rose-50 active:bg-amber-200 text-slate-900 font-extrabold shadow-sm flex flex-col items-center justify-center transition">
            <span class="text-lg sm:text-xl leading-tight">${k.label}</span>
            ${subHint}
          </button>
        `;
      }).join('');

      modal.innerHTML = `
        <div class="fade-view w-full max-w-2xl bg-[#fffefa] border-4 border-amber-500 rounded-3xl shadow-2xl p-3 sm:p-4 flex flex-col gap-2.5 relative">
          <!-- 上部ヘッダーと閉じるボタン -->
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs sm:text-sm font-extrabold text-amber-950 flex items-center gap-1.5">
              <span>⌨️</span>
              <span>なまえを 入力しよう（トグル・フリック・漢字へんかん）</span>
            </span>
            <button type="button" onclick="closeNameKeyboard(false)"
              class="px-3 py-1 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs">
              ✕ やめる
            </button>
          </div>

          <!-- 入力テキスト表示ボックス -->
          <div class="w-full min-h-[48px] px-4 py-2 rounded-2xl bg-white border-2 border-amber-400 flex items-center justify-between gap-2 shadow-inner">
            <div id="kb-text-display" class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-wide break-all"></div>
            <button type="button" onclick="clearKanaAll()"
              class="shrink-0 px-2.5 py-1 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs">
              ぜんぶけす
            </button>
          </div>

          <!-- 漢字変換候補バー -->
          <div id="kb-candidates-bar" class="w-full min-h-[46px] p-1.5 rounded-2xl bg-amber-100 border-2 border-amber-300 flex items-center gap-2 overflow-x-auto"></div>

          <!-- スマホ12キー＋操作キーエリア -->
          <div class="grid grid-cols-4 gap-2 relative" id="kana-keypad-grid">
            <div class="col-span-3 grid grid-cols-3 gap-2">
              ${keysHtml}
            </div>

            <div class="col-span-1 grid grid-rows-4 gap-2">
              <button type="button" onclick="backspaceKana()"
                class="rounded-2xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-900 font-extrabold text-sm sm:text-base shadow-sm active:scale-95 transition flex flex-col items-center justify-center">
                <span>⌫</span>
                <span class="text-xs">1字けす</span>
              </button>

              <button type="button" onclick="advanceKanaCursor()"
                class="rounded-2xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-950 font-extrabold text-sm sm:text-base shadow-sm active:scale-95 transition flex flex-col items-center justify-center">
                <span>→</span>
                <span class="text-xs">つぎの字</span>
              </button>

              <button type="button" onclick="commitComposingText()"
                class="rounded-2xl bg-yellow-300 hover:bg-yellow-400 border-2 border-amber-500 text-amber-950 font-extrabold text-sm sm:text-base shadow-sm active:scale-95 transition flex flex-col items-center justify-center">
                <span>かくてい</span>
              </button>

              <button type="button" onclick="closeNameKeyboard(true)"
                class="rounded-2xl bg-emerald-500 hover:bg-emerald-600 border-b-4 border-emerald-700 text-white font-extrabold text-base sm:text-lg shadow-md active:scale-95 transition flex flex-col items-center justify-center">
                <span>OK</span>
                <span class="text-[11px]">かんりょう</span>
              </button>
            </div>
          </div>

          <!-- フリック方向ガイド用オーバーレイ -->
          <div id="flick-guide-overlay" class="hidden flick-bubble bg-amber-900 text-white rounded-2xl px-3 py-2 shadow-xl border-2 border-yellow-300 text-center">
          </div>
        </div>
      `;

      updateKeyboardDisplay();
      attachFlickAndToggleListeners();
    }

    function attachFlickAndToggleListeners() {
      const keyButtons = document.querySelectorAll('.kana-pad-key');
      const guideEl = document.getElementById('flick-guide-overlay');

      keyButtons.forEach(btn => {
        const keyId = btn.getAttribute('data-key-id');
        const keyObj = KANA_KEYS.find(k => k.id === keyId);
        if (!keyObj) return;

        let startX = 0;
        let startY = 0;
        let activePointerId = null;
        let currentDir = 'center';
        let isFlickMoved = false;

        const updateFlickGuide = (dir) => {
          if (!keyObj.flick || !guideEl) return;
          const rect = btn.getBoundingClientRect();
          const modalRect = btn.closest('.fade-view').getBoundingClientRect();
          guideEl.style.left = `${rect.left - modalRect.left + rect.width / 2}px`;
          guideEl.style.top = `${rect.top - modalRect.top}px`;

          const f = keyObj.flick;
          guideEl.innerHTML = `
            <div class="grid grid-cols-3 gap-1 text-xs sm:text-sm font-extrabold leading-none">
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'up' ? 'bg-yellow-400 text-amber-950 scale-110' : 'opacity-75'}">${f.up}</span>
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'left' ? 'bg-yellow-400 text-amber-950 scale-110' : 'opacity-75'}">${f.left}</span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'center' ? 'bg-yellow-400 text-amber-950 scale-110' : 'opacity-75'}">${f.center}</span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'right' ? 'bg-yellow-400 text-amber-950 scale-110' : 'opacity-75'}">${f.right}</span>
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'down' ? 'bg-yellow-400 text-amber-950 scale-110' : 'opacity-75'}">${f.down}</span>
              <span></span>
            </div>
          `;
          guideEl.classList.remove('hidden');
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          activePointerId = e.pointerId;
          btn.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;
          currentDir = 'center';
          isFlickMoved = false;
          if (keyObj.flick) {
            updateFlickGuide('center');
          }
        });

        btn.addEventListener('pointermove', (e) => {
          if (e.pointerId !== activePointerId || !keyObj.flick) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const dist = Math.hypot(dx, dy);

          if (dist >= 22) {
            isFlickMoved = true;
            if (Math.abs(dx) > Math.abs(dy)) {
              currentDir = dx < 0 ? 'left' : 'right';
            } else {
              currentDir = dy < 0 ? 'up' : 'down';
            }
          } else {
            currentDir = 'center';
          }
          updateFlickGuide(currentDir);
        });

        const endPointer = (e) => {
          if (e.pointerId !== activePointerId) return;
          activePointerId = null;
          if (guideEl) guideEl.classList.add('hidden');

          if (keyObj.isModifier) {
            inputKanaChar(keyObj, 'toggle');
          } else if (isFlickMoved) {
            inputKanaChar(keyObj, 'flick', currentDir);
          } else {
            inputKanaChar(keyObj, 'toggle');
          }
        };

        btn.addEventListener('pointerup', endPointer);
        btn.addEventListener('pointercancel', () => {
          activePointerId = null;
          if (guideEl) guideEl.classList.add('hidden');
        });
      });
    }

    async function downloadCertificate() {
      playSound('tap');
      const target = document.getElementById('certificate-capture');
      if (!target || typeof html2canvas === 'undefined') {
        showToast('スクリーンショット機能で 画面を ほぞんしてね！');
        return;
      }
      try {
        showToast('ごうかくしょうの 画像を つくっています...');
        const canvas = await html2canvas(target, {
          scale: 2,
          backgroundColor: '#fffdf7',
          useCORS: true
        });
        const link = document.createElement('a');
        link.download = `kokugo_gokakusho_${state.selectedGrade}nen.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('ごうかくしょうを ダウンロードしました！');
      } catch (err) {
        console.warn('Screenshot failed:', err);
        showToast('ほぞんできない ときは、たんまつの スクリーンショットを つかってね！');
      }
    }

    /* =========================================================================
       7. 長押し・ダブルタップのコンテキストメニュー抑止と初期描画
       ========================================================================= */
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('selectstart', (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('dblclick', (e) => {
      e.preventDefault();
    }, { passive: false });

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => {
        render();
      });
    } else {
      render();
    }
  </script>
</body>
</html>
